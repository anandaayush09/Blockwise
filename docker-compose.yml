# Brought up in Phase 4 (backend). `docker compose up` should start everything.
# Vector store: pgvector image is a placeholder until ADR-0007 is decided.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: blockwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blockwise
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockwise"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # TODO(Phase 4): healthcheck on /health

  worker:
    build: .
    env_file: .env
    command: ["celery", "-A", "blockwise.worker.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: .
    env_file: .env
    command: ["celery", "-A", "blockwise.worker.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      redis: {condition: service_healthy}

  console:
    build: .
    env_file: .env
    command: ["streamlit", "run", "app/console.py", "--server.port=8501"]
    ports: ["8501:8501"]
    depends_on: [api]
    # TODO(Phase 7): Dockerfile needs the "app" extra and app/ copied for this service.

volumes:
  pgdata:
