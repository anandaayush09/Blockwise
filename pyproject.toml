[project]
name = "blockwise"
version = "0.0.1"
description = "Block-wise power procurement copilot for Indian DISCOMs"
readme = "README.md"
requires-python = ">=3.11"
# Base deps stay light so tests import fast. Heavy libraries live in extras and are
# added in the phase that needs them (see ROADMAP.md).
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
forecast = ["scikit-learn>=1.5", "lightgbm>=4.3", "statsmodels>=0.14"]
optimise = ["ortools>=9.10"]            # DECISION(ADR-0005): or PuLP/HiGHS
rag = ["rank-bm25>=0.2.2", "pypdf>=4.2"]  # DECISION(ADR-0007): add pgvector or qdrant-client
agents = ["anthropic>=0.40", "langgraph>=0.2", "mcp>=1.0"]  # DECISION(ADR-0006)
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "redis>=5.0", "sentry-sdk>=2.0"]
worker = ["celery[redis]>=5.4"]
app = ["streamlit>=1.36"]
evals = ["ragas>=0.1"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-mock>=3.14", "ruff>=0.5", "pip-audit>=2.7"]

[project.scripts]
blockwise = "blockwise.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blockwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter wraps code; long docstring lines are intentional prose, so don't flag them.
ignore = ["E501"]
