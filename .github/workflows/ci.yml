# CI: runs on every push and PR. Make it a required check via branch protection on main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra api
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (no real LLM calls)
        run: uv run pytest
        env:
          ANTHROPIC_API_KEY: ""   # tests must never need a key
      - name: Dependency audit
        run: uv run pip-audit
        continue-on-error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t blockwise:ci .
      # TODO(Phase 10): run `docker history` check that no secret appears; smoke-test /health in a container
